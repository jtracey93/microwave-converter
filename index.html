<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microwave Cooking Time Converter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🔥 Microwave Timer</h1>
        </header>

        <main class="main-content">
            <div class="converter-card">
                <!-- Photo Scanner Section -->
                <div class="scanner-section">
                    <div class="scanner-header">
                        <span class="scanner-icon">📷</span>
                        <span class="scanner-text">Scan Cooking Instructions</span>
                    </div>
                    <div class="scanner-buttons">
                        <button type="button" id="capturePhotoBtn" class="scanner-btn">
                            <span class="btn-icon">📸</span>
                            <span class="btn-text">Take Photo</span>
                        </button>
                        <button type="button" id="uploadPhotoBtn" class="scanner-btn">
                            <span class="btn-icon">🖼️</span>
                            <span class="btn-text">Upload Image</span>
                        </button>
                    </div>
                    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;">
                    <input type="file" id="uploadInput" accept="image/*" style="display: none;">
                    
                    <!-- Scanning status -->
                    <div id="scanStatus" class="scan-status hidden">
                        <div class="scan-loader"></div>
                        <p class="scan-text">Scanning image...</p>
                    </div>
                    
                    <!-- Scan result preview -->
                    <div id="scanResult" class="scan-result hidden">
                        <div class="scan-result-header">
                            <span class="result-icon">✓</span>
                            <span class="result-text">Instructions detected!</span>
                        </div>
                        <div class="scan-result-content">
                            <p id="scanResultText" class="result-details"></p>
                        </div>
                    </div>
                </div>

                <div class="section-divider-with-text">
                    <span class="divider-text">or enter manually</span>
                </div>

                <form id="converterForm" class="converter-form">
                    <div class="input-group">
                        <label>Recipe Instructions</label>
                        <div class="field">
                            <label for="originalWattage" class="field-label">Microwave Wattage</label>
                            <div class="input-with-controls">
                                <button type="button" class="control-btn" id="originalWattageDown">−</button>
                                <input type="number" id="originalWattage" placeholder="e.g. 800" min="100" max="2000" value="800" required>
                                <button type="button" class="control-btn" id="originalWattageUp">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Cooking Time</label>
                        <div class="time-row">
                            <div class="field">
                                <label for="originalMinutes" class="field-label">Minutes</label>
                                <div class="input-with-controls">
                                    <button type="button" class="control-btn" id="minutesDown">−</button>
                                    <input type="number" id="originalMinutes" placeholder="0" min="0" max="60" value="8">
                                    <button type="button" class="control-btn" id="minutesUp">+</button>
                                </div>
                            </div>
                            <div class="field">
                                <label for="originalSeconds" class="field-label">Seconds</label>
                                <div class="input-with-controls">
                                    <button type="button" class="control-btn" id="secondsDown">−</button>
                                    <input type="number" id="originalSeconds" placeholder="0" min="0" max="59" value="0">
                                    <button type="button" class="control-btn" id="secondsUp">+</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="section-divider"></div>

                    <div class="input-group">
                        <label>Your Microwave</label>
                        <div class="field">
                            <label for="targetWattage" class="field-label">Your Wattage</label>
                            <div class="input-with-controls">
                                <button type="button" class="control-btn" id="targetWattageDown">−</button>
                                <input type="number" id="targetWattage" placeholder="e.g. 700" min="100" max="2000" value="700" required>
                                <button type="button" class="control-btn" id="targetWattageUp">+</button>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="calculate-btn">Calculate</button>
                </form>

                <div id="result" class="result-section hidden">
                    <div class="result-time">
                        <span id="resultTime" class="time-display"></span>
                    </div>
                    <p id="resultExplanation" class="explanation"></p>
                    <button type="button" id="resetBtn" class="reset-btn">New Calculation</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Built for better cooking 👨‍🍳</p>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
